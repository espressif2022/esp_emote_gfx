# This workflow builds test_apps for multiple IDF versions.

name: "Build test_apps"

on:
    push:
        branches:
        - master
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        idf-version: ['release-v5.3', 'release-v5.4', 'release-v5.5']
      fail-fast: false
    container: espressif/idf:${{matrix.idf-version}}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Check platform boundary (no esp_* in src/)
        run: scripts/check_no_esp_in_src.sh

      - name: Build host SDL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config
          cmake -S . -B build-host-sdl -DGFX_BUILD_HOST_SDL=ON -DBUILD_TESTING=ON
          cmake --build build-host-sdl --parallel
          cd build-host-sdl && ctest --output-on-failure

      - name: Build test_apps (unit + visual + hw)
        shell: bash
        timeout-minutes: 100
        run: |
          . $IDF_PATH/export.sh
          pip install idf-build-apps

          cd $GITHUB_WORKSPACE
          IDF_CCACHE_ENABLE=1 idf-build-apps build \
            -p test_apps/unit \
            -p test_apps/visual \
            -p test_apps \
            --config-rules "sdkconfig.bsp.*=" \
            -vv

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test_apps-build-idf-${{matrix.idf-version}}
          path: |
            test_apps/build*/
            test_apps/unit/build*/
            test_apps/visual/build*/
          retention-days: 7
          if-no-files-found: warn
