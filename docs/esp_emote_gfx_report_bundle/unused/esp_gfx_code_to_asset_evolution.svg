  <rect x="869" y="266" width="343" height="52" rx="9" fill="#fff" stroke="rgba(231,53,44,.32)" stroke-width="1"/>  <rect x="869" y="273" width="3" height="38" rx="1.5" fill="#e7352c"/>  <circle cx="881" cy="292" r="13" fill="#e7352c"/>  <text x="881" y="296" text-anchor="middle" font-size="10" fill="white" font-weight="700">S</text>  <text x="903" y="288" font-size="13" font-weight="700" fill="#111">Scene Package（资源包）</text>  <text x="903" y="306" font-size="11" fill="#6b3430">UI 描述 + 资源引用 + 预计算数据</text>
