  <rect x="853" y="112" width="375" height="538" rx="16" fill="#fff4f3" stroke="rgba(231,53,44,.5)" stroke-width="1.7"/>
  <rect x="38" y="130" width="343" height="52" rx="9" fill="#f4f4f1" stroke="#d4d4d0" stroke-width="1"/>  <rect x="38" y="137" width="3" height="38" rx="1.5" fill="#7a7570"/>  <circle cx="50" cy="156" r="13" fill="#a0a09a"/>  <text x="50" y="160" text-anchor="middle" font-size="10" fill="white" font-weight="700">P</text>  <text x="72" y="152" font-size="13" font-weight="700" fill="#111">需求 / Prompt</text>  <text x="72" y="170" font-size="11" fill="#5a5a5a">用户想要什么界面</text>
  <path d="M209 182 V198" fill="none" stroke="#737373" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="38" y="198" width="343" height="52" rx="9" fill="#f4f4f1" stroke="#d4d4d0" stroke-width="1"/>  <rect x="38" y="205" width="3" height="38" rx="1.5" fill="#7a7570"/>  <circle cx="50" cy="224" r="13" fill="#a0a09a"/>  <text x="50" y="228" text-anchor="middle" font-size="10" fill="white" font-weight="700">AI</text>  <text x="72" y="220" font-size="13" font-weight="700" fill="#111">AI 生成 C / JS 代码</text>  <text x="72" y="238" font-size="11" fill="#5a5a5a">生成大量 widget API 调用代码</text>
  <path d="M209 250 V266" fill="none" stroke="#737373" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="38" y="266" width="343" height="52" rx="9" fill="#f4f4f1" stroke="#d4d4d0" stroke-width="1"/>  <rect x="38" y="273" width="3" height="38" rx="1.5" fill="#7a7570"/>  <circle cx="50" cy="292" r="13" fill="#a0a09a"/>  <text x="50" y="296" text-anchor="middle" font-size="10" fill="white" font-weight="700">U</text>  <text x="72" y="288" font-size="13" font-weight="700" fill="#111">App create() 构建 UI</text>  <text x="72" y="306" font-size="11" fill="#5a5a5a">UI 结构、资源绑定、业务逻辑混在一起</text>
  <path d="M209 318 V334" fill="none" stroke="#737373" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="38" y="334" width="343" height="52" rx="9" fill="#f4f4f1" stroke="#d4d4d0" stroke-width="1"/>  <rect x="38" y="341" width="3" height="38" rx="1.5" fill="#7a7570"/>  <circle cx="50" cy="360" r="13" fill="#a0a09a"/>  <text x="50" y="364" text-anchor="middle" font-size="10" fill="white" font-weight="700">T</text>  <text x="72" y="356" font-size="13" font-weight="700" fill="#111">Object Tree</text>  <text x="72" y="374" font-size="11" fill="#5a5a5a">运行时对象树</text>
