  <text x="56" y="52" font-size="28" font-weight="720" fill="#101010">GUI 构建模式演进：</text>
  <text x="332" y="52" font-size="28" font-weight="720" fill="#e7352c">Code-driven</text>
  <text x="532" y="52" font-size="28" font-weight="720" fill="#101010"> → </text>
  <text x="570" y="52" font-size="28" font-weight="720" fill="#e7352c">Asset-driven</text>
  <rect x="56" y="62" width="1148" height="34" rx="8" fill="rgba(231,53,44,.08)" stroke="rgba(231,53,44,.28)" stroke-width="1.2"/>
  <text x="630" y="84" text-anchor="middle" font-size="13.5" fill="#6b3430">AI 的输出从代码变成 UI 描述资产，Runtime 负责解析与渲染，UI 与业务解耦，同一描述包跨端复用。</text>
  <text x="38" y="107" font-size="11.5" font-weight="760" fill="#737373" letter-spacing="1">当前模式：Code-driven（AI 写代码）</text>
  <text x="484" y="107" font-size="11.5" font-weight="760" fill="#8a5a00" letter-spacing="1">核心变化</text>
  <text x="866" y="107" font-size="11.5" font-weight="760" fill="#e7352c" letter-spacing="1">未来模式：Asset-driven（AI 改描述）</text>
