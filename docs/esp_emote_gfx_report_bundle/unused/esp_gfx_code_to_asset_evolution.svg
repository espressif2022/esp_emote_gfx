  <rect x="38" y="402" width="343" height="52" rx="9" fill="#f4f4f1" stroke="#d4d4d0" stroke-width="1"/>  <rect x="38" y="409" width="3" height="38" rx="1.5" fill="#7a7570"/>  <circle cx="50" cy="428" r="13" fill="#a0a09a"/>  <text x="50" y="432" text-anchor="middle" font-size="10" fill="white" font-weight="700">R</text>  <text x="72" y="424" font-size="13" font-weight="700" fill="#111">Renderer</text>  <text x="72" y="442" font-size="11" fill="#5a5a5a">布局 / 绘制 / 动画</text>
